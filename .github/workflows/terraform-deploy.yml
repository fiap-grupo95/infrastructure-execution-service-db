name: Terraform Deploy (on PR merge -> main)

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  terraform-apply:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/atlas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        env:
          TF_VAR_mongodb_atlas_public_key: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          TF_VAR_mongodb_atlas_private_key: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
          TF_VAR_mongodb_atlas_org_id: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          TF_VAR_mongodb_atlas_allow_cidr: ${{ secrets.MONGODB_ATLAS_ALLOW_CIDR }}
        run: terraform init -input=false

      - name: Terraform apply
        env:
          TF_VAR_mongodb_atlas_public_key: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          TF_VAR_mongodb_atlas_private_key: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
          TF_VAR_mongodb_atlas_org_id: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          TF_VAR_mongodb_atlas_allow_cidr: ${{ secrets.MONGODB_ATLAS_ALLOW_CIDR }}
        run: terraform apply -input=false -auto-approve
